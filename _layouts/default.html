<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon-16.png' | relative_url }}" type="image/png" sizes="16x16">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Notes" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <header class="site-header">
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.section == 'notes' %} aria-current="page"{% endif %}>Notes</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      </nav>
      <button class="theme-picker" id="theme-toggle" type="button" data-mode="system" aria-label="Theme: System. Switch to Light." title="Theme: System. Switch to Light.">
        <svg data-icon="system" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="14" height="10" rx="1.5"/><path d="M10 14v3M6 17h8"/></svg>
        <svg data-icon="light" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v1M10 17v1M2 10h1M17 10h1M4.3 4.3l.7.7M15 15l.7.7M4.3 15.7l.7-.7M15 5l.7-.7"/></svg>
        <svg data-icon="dark" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 12A7 7 0 0 1 8 3.5 7 7 0 1 0 16.5 12Z"/></svg>
      </button>
    </header>
    <main id="main">{{ content }}</main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.data.profile.name | escape }} · <a class="rss-link" href="{{ '/feed.xml' | relative_url }}"><img src="{{ '/assets/rss-icon.png' | relative_url }}" alt="" width="10" height="10"> RSS</a></footer>
  </body>
</html>

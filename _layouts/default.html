<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Notes" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.section == 'notes' %} aria-current="page"{% endif %}>Notes</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.data.profile.name | escape }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
  </body>
</html>

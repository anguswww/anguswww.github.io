<li class="note-row">
  <a class="note-title" href="{{ note.url | relative_url }}">{{ note.title | escape }}</a>
  {% if note.description %}<p class="note-description">{{ note.description | escape }}</p>{% endif %}
  <time class="note-date" datetime="{{ note.date | date_to_xmlschema }}">{{ note.date | date: '%d %b %Y' }}</time>
</li>

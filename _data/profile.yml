name: Angus
intro: I build things for the web, follow my curiosity, and occasionally write about what I find.
bio: >-
  I'm a maker and a perpetual student of how things work. I'm drawn to
  thoughtful software, simple design, and the little details that make
  something feel good to use.
about: >-
  This is my small corner of the internet. A place for side projects,
  half-formed ideas, and notes from whatever I'm learning. It's a little
  less polished than a portfolio, and a little more personal.
github: https://github.com/anguswww
